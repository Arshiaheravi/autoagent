# Allowlist egress proxy for untrusted tenant sandboxes.
# Default-deny: only hosts in the filter file are reachable, and only CONNECT to
# 443. Everything else — cloud metadata, the control plane, sibling services — is
# refused. This is the single hole punched through the --internal network wall.

Port 8888
Listen 0.0.0.0
Timeout 600

# No upstream; tinyproxy resolves + connects directly for allowlisted hosts only.
Allow 0.0.0.0/0

# Domain allowlist. FilterDefaultDeny flips the filter to "deny unless matched",
# FilterExtended uses ERE. api.anthropic.com is the ONLY thing tenants may reach.
Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
FilterExtended On
FilterCaseSensitive Off

# Only allow tunnelling HTTPS (443). No plaintext CONNECT to arbitrary ports —
# this blocks CONNECT 169.254.169.254:80 / control-plane:5432 style abuse.
ConnectPort 443

DisableViaHeader Yes
